<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Be Vietnam Pro",sans-serif;color:#e9eef2;
 background:radial-gradient(700px 420px at 80% 10%,rgba(214,196,161,.16),transparent 60%),radial-gradient(600px 400px at 5% 100%,rgba(85,255,181,.07),transparent 60%),linear-gradient(160deg,#070b0e,#0d1820 60%,#0a1218)}
.grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px}
.frame{position:absolute;inset:22px;border:1px solid rgba(214,196,161,.22);border-radius:18px}
.left{position:absolute;left:72px;top:64px;width:600px}
.brand{display:flex;align-items:center;gap:12px;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#c9d6df}
.brand b{color:#d6c4a1}.dot{width:10px;height:10px;background:#d6c4a1;transform:rotate(45deg)}
.pill{display:inline-block;margin-top:34px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:#f0e3c7;border:1px solid rgba(214,196,161,.45);border-radius:999px;padding:7px 16px;background:rgba(214,196,161,.08)}
h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:96px;line-height:.92;margin-top:22px;color:#f0e3c7}
h1 em{display:block;font-style:italic;color:#fff}
.sub{margin-top:26px;font-size:21px;line-height:1.5;color:#9fb2c1}
.sub b{color:#e9eef2;font-weight:500}
.els{display:flex;gap:14px;margin-top:30px}
.els img{width:40px;height:40px;filter:drop-shadow(0 0 8px rgba(255,255,255,.18))}
.url{position:absolute;left:72px;bottom:52px;font-size:17px;letter-spacing:.06em;color:#90a4b4}
.url b{color:#d6c4a1;font-weight:600}
.cards{position:absolute;right:52px;top:70px;width:470px;height:490px}
.card{position:absolute;width:236px;height:330px;border-radius:16px;overflow:hidden;border:1px solid rgba(214,196,161,.35);box-shadow:0 26px 50px rgba(0,0,0,.55);
 background:linear-gradient(180deg,#13222c,#0d181f)}
.card img{width:100%;height:100%;object-fit:cover;object-position:top center}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(7,11,14,.9))}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--el);z-index:2}
.card span{position:absolute;left:16px;bottom:14px;z-index:3;font-family:"Cormorant Garamond",serif;font-size:30px;color:#f0e3c7}
.c1{left:0;top:110px;transform:rotate(-7deg);--el:#F0744E}
.c3{right:0;top:110px;transform:rotate(7deg);--el:#41AEFB}
.c3 span{left:auto;right:16px}
.c2{left:117px;top:40px;width:250px;height:360px;z-index:2;--el:#F8E56C;border-color:rgba(240,227,199,.7)}
</style></head><body><div class="grid"></div><div class="frame"></div>
<div class="left">
 <div class="brand"><span class="dot"></span><span><b>Wuthering Waves</b> · Resonators Archive</span></div>
 <div class="pill">Patch 3.8 · 61 Resonators</div>
 <h1>Kho hồ sơ<em>Resonators</em></h1>
 <p class="sub"><b>Cây kỹ năng · Bộ kỹ năng · Chuỗi cộng hưởng · Nguyên liệu</b><br>Song ngữ: Tiếng Việt · English</p>
 <div class="els"><img src="../../public/assets/icons/element/spectro.png"><img src="../../public/assets/icons/element/havoc.png"><img src="../../public/assets/icons/element/aero.png"><img src="../../public/assets/icons/element/electro.png"><img src="../../public/assets/icons/element/fusion.png"><img src="../../public/assets/icons/element/glacio.png"></div>
</div>
<div class="url"><b>wuwa-characters.vercel.app</b></div>
<div class="cards">
 <div class="card c1"><img src="https://cdn.prydwen.gg/images/wuthering-waves/characters/changli_card.webp"><span>Changli</span></div>
 <div class="card c3"><img src="https://cdn.prydwen.gg/images/wuthering-waves/characters/carlotta_card.webp"><span>Carlotta</span></div>
 <div class="card c2"><img src="https://cdn.prydwen.gg/images/wuthering-waves/characters/jinhsi_card.webp"><span>Jinhsi</span></div>
</div></body></html>
